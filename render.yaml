services:
  - type: web
    name: StarSocial-web
    env: python
    plan: free
    repo: https://github.com/ankiphr09/StarSocial
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      bash -lc "python manage.py migrate --noinput && python manage.py collectstatic --noinput && \
      gunicorn simplesocial.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: '*'
